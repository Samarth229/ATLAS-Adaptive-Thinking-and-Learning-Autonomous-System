<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #0a0a0a;
    --bg2:    #121212;
    --bg3:    #1c1c1c;
    --border: #232323;
    --text:   #c8c8c8;
    --dim:    #5f5e5a;
    --accent-blue:   #378add;
    --accent-green:  #1d9e75;
    --accent-yellow: #d4a843;
    --accent-red:    #d85a30;
    --accent-purple: #7f77dd;
    --font: 'SF Mono', 'Consolas', 'Monaco', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* TOP BAR */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 16px;
    background: var(--bg2);
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }
  #topbar .brand { color: var(--accent-blue); font-size: 13px; letter-spacing: 4px; font-weight: 700; }
  #topbar .sys-info { display: flex; gap: 18px; color: var(--dim); font-size: 11px; }
  #topbar .sys-info span { color: var(--text); }
  #clock { color: var(--accent-blue); font-size: 13px; }

  /* LAYOUT */
  #main { display: flex; flex: 1; overflow: hidden; }

  #left {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 0.5px solid var(--border);
    overflow: hidden;
  }

  /* PANEL LABEL */
  #panel-label {
    padding: 7px 14px;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--dim);
    text-transform: uppercase;
    border-bottom: 0.5px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* STATUS DOT */
  #clear-btn {
    margin-left: auto;
    background: none;
    border: 0.5px solid var(--border);
    color: var(--dim);
    font-family: var(--font);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  #clear-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }

  #status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  #status-dot.active {
    background: #5dcaa5;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.7); }
  }

  /* CONVERSATION FEED */
  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #conversation::-webkit-scrollbar { width: 3px; }
  #conversation::-webkit-scrollbar-track { background: transparent; }
  #conversation::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg { display: flex; flex-direction: column; gap: 3px; max-width: 82%; }
  .msg.user { align-self: flex-end; }
  .msg.atlas { align-self: flex-start; }
  .msg .label { font-size: 10px; letter-spacing: 0.5px; color: var(--dim); }
  .msg.user .label { color: #5dcaa5; text-align: right; }
  .msg.atlas .label { color: var(--accent-blue); }

  .msg.user .bubble {
    padding: 8px 12px;
    border-radius: 10px 10px 2px 10px;
    line-height: 1.55;
    font-size: 12px;
    background: #1a2e28;
    border: 0.5px solid #2a4a3a;
    color: #d8f0e6;
  }
  .msg.atlas .bubble {
    padding: 8px 12px;
    border-radius: 10px 10px 10px 2px;
    line-height: 1.55;
    font-size: 12px;
    background: #161b24;
    border: 0.5px solid #1e2a3a;
    color: var(--text);
  }
  .msg.atlas .bubble strong { color: #e8e8e8; font-weight: 600; }
  .list-item { margin: 3px 0; padding-left: 2px; }
  .list-number { color: var(--accent-purple); font-weight: 500; margin-right: 4px; }

  #empty-state { color: var(--dim); font-size: 11px; text-align: center; margin-top: 40px; line-height: 2.2; }

  /* RIGHT PANEL */
  #right {
    width: 296px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    gap: 1px;
    background: var(--border);
  }
  #right::-webkit-scrollbar { width: 2px; }
  #right::-webkit-scrollbar-thumb { background: var(--border); }

  .card {
    background: var(--bg2);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-title {
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  /* ACTIVE WINDOW */
  #active-title { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  #active-meta { color: var(--dim); font-size: 11px; }
  #focus-dur { color: var(--accent-yellow); font-size: 11px; }

  /* SYSTEM METERS */
  .meter-row { display: flex; flex-direction: column; gap: 4px; }
  .meter-label { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; }
  .meter-label span:last-child { color: var(--text); }
  .meter-bar { height: 3px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
  .meter-fill.cpu { background: var(--accent-blue); }
  .meter-fill.ram { background: var(--accent-purple); }
  .meter-fill.bat { background: var(--accent-green); }
  #bat-status { font-size: 10px; color: var(--accent-green); display: none; }

  /* USAGE BARS */
  .usage-row { display: flex; flex-direction: column; gap: 4px; }
  .usage-label { display: flex; justify-content: space-between; }
  .usage-proc { color: var(--text); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .usage-time { color: var(--dim); font-size: 11px; }
  .usage-bar { height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .usage-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

  /* LEARNING PROGRESS */
  #learn-bar-wrap { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-top: 2px; }
  #learn-fill { height: 100%; background: var(--accent-green); border-radius: 2px; transition: width 0.4s ease; }
  #learn-label { color: var(--dim); font-size: 11px; }
  #learn-reliable { font-size: 10px; color: var(--accent-green); display: none; }

  /* REMINDERS */
  #reminders-list { display: flex; flex-direction: column; gap: 6px; }
  .reminder-item {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 8px; padding: 7px 9px;
    background: var(--bg3);
    border: 0.5px solid var(--border);
    border-radius: 8px;
  }
  .reminder-text { font-size: 11px; line-height: 1.45; flex: 1; }
  .reminder-due { font-size: 10px; color: var(--dim); margin-top: 2px; }
  .dismiss-btn {
    background: none;
    border: 0.5px solid var(--border);
    color: var(--dim);
    font-family: var(--font);
    font-size: 10px;
    padding: 2px 7px;
    cursor: pointer;
    border-radius: 6px;
    flex-shrink: 0;
    transition: border-color 0.2s, color 0.2s;
  }
  .dismiss-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }
  #no-reminders { color: var(--dim); font-size: 11px; }

  /* MUTE BUTTONS — pill style */
  #mute-controls { display: flex; gap: 6px; flex-wrap: wrap; }
  .mute-btn {
    background: var(--bg3);
    border: 0.5px solid #2a2a2a;
    color: var(--text);
    font-family: var(--font);
    font-size: 11px;
    padding: 5px 13px;
    cursor: pointer;
    border-radius: 16px;
    transition: background 0.15s, border-color 0.15s;
  }
  .mute-btn:hover { background: #262626; border-color: #3a3a3a; }
  #mute-status { font-size: 10px; color: var(--accent-yellow); display: none; padding: 2px 0; }

  /* BOTTOM NOTIFICATION STRIP */
  #bottombar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    padding: 8px 14px;
    background: #161b14;
    border-top: 0.5px solid #2a3327;
    flex-shrink: 0;
    min-height: 34px;
  }
  #notif-label { font-size: 10px; letter-spacing: 0.5px; color: var(--dim); white-space: nowrap; text-transform: uppercase; }
  #last-notif { font-size: 12px; color: #c0dd97; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #notif-time { font-size: 10px; color: var(--dim); white-space: nowrap; }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">A.T.L.A.S</div>
  <div class="sys-info">
    <div>CPU <span id="cpu-val">—</span>%</div>
    <div>RAM <span id="ram-val">—</span>%</div>
    <div>BAT <span id="bat-val">—</span>%</div>
  </div>
  <div id="clock">—:——</div>
</div>

<div id="main">
  <div id="left">
    <div id="panel-label">
      <div id="status-dot"></div>
      CONVERSATION
      <button id="clear-btn" onclick="clearConversation()" title="Extract memories then clear">✕ clear</button>
    </div>
    <div id="conversation">
      <div id="empty-state">No conversation yet.<br>Say "Hey Jarvis" to begin.</div>
    </div>
  </div>

  <div id="right">
    <div class="card">
      <div class="card-title">ACTIVE WINDOW</div>
      <div id="active-title">—</div>
      <div id="active-meta">—</div>
      <div id="focus-dur">focused 0.0 min</div>
    </div>

    <div class="card">
      <div class="card-title">SYSTEM</div>
      <div class="meter-row">
        <div class="meter-label"><span>CPU</span><span id="cpu-pct">—%</span></div>
        <div class="meter-bar"><div class="meter-fill cpu" id="cpu-bar" style="width:0%"></div></div>
      </div>
      <div class="meter-row">
        <div class="meter-label"><span>RAM</span><span id="ram-pct">—%</span></div>
        <div class="meter-bar"><div class="meter-fill ram" id="ram-bar" style="width:0%"></div></div>
      </div>
      <div class="meter-row">
        <div class="meter-label"><span>BAT</span><span id="bat-pct">—%</span></div>
        <div class="meter-bar"><div class="meter-fill bat" id="bat-bar" style="width:0%"></div></div>
      </div>
      <div id="bat-status">⚡ charging</div>
    </div>

    <div class="card">
      <div class="card-title">TODAY'S USAGE</div>
      <div id="usage-list"><div style="color:var(--dim);font-size:10px">Loading…</div></div>
    </div>

    <div class="card">
      <div class="card-title">PATTERN LEARNING</div>
      <div id="learn-bar-wrap"><div id="learn-fill" style="width:0%"></div></div>
      <div id="learn-label">0 / 14 days</div>
      <div id="learn-reliable">✓ Patterns reliable</div>
    </div>

    <div class="card">
      <div class="card-title">REMINDERS</div>
      <div id="reminders-list">
        <div id="no-reminders">No active reminders.</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">MUTE PROACTIVE</div>
      <div id="mute-controls">
        <button class="mute-btn" onclick="mute(30)">30 min</button>
        <button class="mute-btn" onclick="mute(60)">1 hour</button>
        <button class="mute-btn" onclick="mute(480)">Until tomorrow</button>
      </div>
      <div id="mute-status"></div>
    </div>
  </div>
</div>

<div id="bottombar">
  <div id="notif-label">LAST ALERT</div>
  <div id="last-notif">—</div>
  <div id="notif-time"></div>
</div>

<script>
  const API = 'http://127.0.0.1:7437';
  let lastLogLength = 0;

  function simpleMarkdownToHtml(text) {
    let html = text;
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<div class="list-item"><span class="list-number">$1.</span> $2</div>');
    html = html.replace(/\n/g, '<br>');
    return html;
  }
  let dotTimeout = null;

  function flashDot() {
    const dot = document.getElementById('status-dot');
    dot.classList.add('active');
    if (dotTimeout) clearTimeout(dotTimeout);
    dotTimeout = setTimeout(() => dot.classList.remove('active'), 4000);
  }

  function api(path, opts) {
    return fetch(API + path, opts).then(r => r.json()).catch(() => null);
  }

  function timeSince(ts) {
    const diff = Math.floor(Date.now() / 1000 - ts);
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    return Math.floor(diff / 3600) + 'h ago';
  }

  function formatDueTime(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
    catch { return ''; }
  }

  async function refreshState() {
    const s = await api('/api/live_state');
    if (!s) return;
    document.getElementById('clock').textContent = s.current_time;
    document.getElementById('cpu-val').textContent = Math.round(s.cpu_percent ?? 0);
    document.getElementById('ram-val').textContent = Math.round(s.ram_percent ?? 0);
    document.getElementById('bat-val').textContent = s.battery_percent != null ? Math.round(s.battery_percent) : '—';
    document.getElementById('active-title').textContent = s.active_window_title || '—';
    document.getElementById('active-meta').textContent = s.active_process_name || '—';
    document.getElementById('focus-dur').textContent = `focused ${s.focus_duration_minutes} min`;
    const cpu = Math.round(s.cpu_percent ?? 0);
    const ram = Math.round(s.ram_percent ?? 0);
    const bat = s.battery_percent != null ? Math.round(s.battery_percent) : 0;
    document.getElementById('cpu-pct').textContent = cpu + '%';
    document.getElementById('ram-pct').textContent = ram + '%';
    document.getElementById('bat-pct').textContent = s.battery_percent != null ? bat + '%' : '—';
    document.getElementById('cpu-bar').style.width = cpu + '%';
    document.getElementById('ram-bar').style.width = ram + '%';
    document.getElementById('bat-bar').style.width = bat + '%';
    const batStatus = document.getElementById('bat-status');
    batStatus.style.display = s.battery_plugged ? 'block' : 'none';
  }

  async function refreshUsage() {
    const apps = await api('/api/today_usage');
    const list = document.getElementById('usage-list');
    if (!apps || apps.length === 0) {
      list.innerHTML = '<div style="color:var(--dim);font-size:10px">No usage data yet.</div>';
      return;
    }
    const palette = ['#378add','#7f77dd','#1d9e75','#d4a843','#d85a30','#5dcaa5'];
    const appColors = {};
    let ci = 0;
    function colorFor(proc) {
      const key = proc.toLowerCase();
      if (key.includes('code')) return '#7f77dd';
      if (key.includes('brave') || key.includes('chrome') || key.includes('firefox')) return '#378add';
      if (key.includes('discord')) return '#d85a30';
      if (key.includes('spotify')) return '#1d9e75';
      if (key.includes('electron')) return '#5dcaa5';
      if (!appColors[key]) appColors[key] = palette[ci++ % palette.length];
      return appColors[key];
    }
    list.innerHTML = apps.map(a => `
      <div class="usage-row">
        <div class="usage-label">
          <span class="usage-proc">${a.process}</span>
          <span class="usage-time">${a.minutes}m</span>
        </div>
        <div class="usage-bar"><div class="usage-fill" style="width:${a.percent_of_max}%;background:${colorFor(a.process)}"></div></div>
      </div>
    `).join('');
  }

  async function refreshLearning() {
    const lp = await api('/api/learning_progress');
    if (!lp) return;
    document.getElementById('learn-fill').style.width = lp.percent + '%';
    document.getElementById('learn-label').textContent = `${lp.days_available} / ${lp.days_needed} days`;
    document.getElementById('learn-reliable').style.display = lp.reliable ? 'block' : 'none';
  }

  async function refreshReminders() {
    const reminders = await api('/api/reminders');
    const list = document.getElementById('reminders-list');
    const noR = document.getElementById('no-reminders');
    list.querySelectorAll('.reminder-item').forEach(el => el.remove());
    if (!reminders || reminders.length === 0) { noR.style.display = 'block'; return; }
    noR.style.display = 'none';
    reminders.forEach(r => {
      const div = document.createElement('div');
      div.className = 'reminder-item';
      const due = r.due_at ? `<div class="reminder-due">due ${formatDueTime(r.due_at)}</div>` : '';
      div.innerHTML = `
        <div>
          <div class="reminder-text">${r.text}</div>
          ${due}
        </div>
        <button class="dismiss-btn" onclick="dismissReminder('${r.text.replace(/'/g,"\\'")}', this.closest('.reminder-item'))">✕</button>
      `;
      list.appendChild(div);
    });
  }

  async function dismissReminder(text, el) {
    el.style.opacity = '0.4';
    const result = await api('/api/dismiss_reminder', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text})
    });
    if (result && result.success) {
      el.remove();
      if (!document.querySelector('.reminder-item')) document.getElementById('no-reminders').style.display = 'block';
    } else {
      el.style.opacity = '1';
    }
  }

  async function mute(minutes) {
    await api('/api/mute_proactive', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({minutes})
    });
    refreshMuteStatus();
  }

  async function refreshMuteStatus() {
    const status = await api('/api/mute_status');
    const el = document.getElementById('mute-status');
    if (status && status.muted) {
      el.textContent = `⏸ muted — ${status.remaining_minutes}m remaining`;
      el.style.display = 'block';
    } else {
      el.style.display = 'none';
    }
  }

  async function refreshConversation() {
    const log = await api('/api/conversation_log');
    if (!log || log.length === lastLogLength) return;
    lastLogLength = log.length;
    const feed = document.getElementById('conversation');
    const empty = document.getElementById('empty-state');
    if (log.length > 0 && empty) empty.style.display = 'none';
    feed.querySelectorAll('.msg').forEach(el => el.remove());
    let hasNewAtlas = false;
    log.forEach(entry => {
      const div = document.createElement('div');
      div.className = `msg ${entry.speaker}`;
      const bubbleContent = entry.speaker === 'atlas'
        ? simpleMarkdownToHtml(entry.text)
        : entry.text;
      div.innerHTML = `
        <div class="label">${entry.speaker === 'user' ? 'YOU' : 'ATLAS'}</div>
        <div class="bubble">${bubbleContent}</div>
      `;
      feed.appendChild(div);
      if (entry.speaker === 'atlas') hasNewAtlas = true;
    });
    if (hasNewAtlas) flashDot();
    feed.scrollTop = feed.scrollHeight;
  }

  async function refreshNotification() {
    const n = await api('/api/last_notification');
    if (!n) return;
    document.getElementById('last-notif').textContent = n.message;
    document.getElementById('notif-time').textContent = timeSince(n.timestamp);
  }

  async function clearConversation() {
    const btn = document.getElementById('clear-btn');
    btn.textContent = '…';
    btn.disabled = true;
    const result = await api('/api/clear_conversation', { method: 'POST' });
    if (result && result.facts_learned_before_clearing > 0) {
      console.log(`[ATLAS] Learned ${result.facts_learned_before_clearing} fact(s) before clearing.`);
    }
    lastLogLength = 0;
    const feed = document.getElementById('conversation');
    feed.querySelectorAll('.msg').forEach(el => el.remove());
    const empty = document.getElementById('empty-state');
    if (empty) empty.style.display = 'block';
    btn.textContent = '✕ clear';
    btn.disabled = false;
  }

  // Boot
  refreshState();
  refreshUsage();
  refreshLearning();
  refreshReminders();
  refreshMuteStatus();
  refreshConversation();
  refreshNotification();

  setInterval(refreshState,        3000);
  setInterval(refreshConversation, 2000);
  setInterval(refreshUsage,       30000);
  setInterval(refreshLearning,    60000);
  setInterval(refreshReminders,   10000);
  setInterval(refreshMuteStatus,  15000);
  setInterval(refreshNotification,10000);
</script>
</body>
</html>
