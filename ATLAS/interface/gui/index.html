<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #181818;
    --border: #222222;
    --text: #c8c8c8;
    --dim: #555555;
    --accent-blue: #3a8fff;
    --accent-green: #2ecc71;
    --accent-yellow: #f0c040;
    --accent-red: #e05050;
    --accent-purple: #a070ff;
    --font: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* TOP BAR */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #topbar .brand {
    color: var(--accent-blue);
    font-size: 13px;
    letter-spacing: 4px;
    font-weight: 700;
  }
  #topbar .sys-info {
    display: flex;
    gap: 20px;
    color: var(--dim);
    font-size: 11px;
  }
  #topbar .sys-info span { color: var(--text); }
  #clock { color: var(--accent-blue); font-size: 13px; }

  /* MAIN LAYOUT */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* LEFT PANEL — conversation */
  #left {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  #panel-label {
    padding: 8px 14px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
  }

  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #conversation::-webkit-scrollbar { width: 4px; }
  #conversation::-webkit-scrollbar-track { background: var(--bg); }
  #conversation::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-width: 90%;
  }
  .msg.user { align-self: flex-end; }
  .msg.atlas { align-self: flex-start; }
  .msg .label {
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--dim);
  }
  .msg.user .label { color: var(--accent-green); text-align: right; }
  .msg.atlas .label { color: var(--accent-blue); }
  .msg .bubble {
    padding: 7px 10px;
    border-radius: 4px;
    line-height: 1.5;
    font-size: 12px;
    background: var(--bg3);
    border: 1px solid var(--border);
  }
  .msg.user .bubble { border-color: #1a3a1a; background: #0d1f0d; color: #90e890; }
  .msg.atlas .bubble { border-color: #1a2a3a; background: #0d1525; }

  #empty-state {
    color: var(--dim);
    font-size: 11px;
    text-align: center;
    margin-top: 40px;
    line-height: 2;
  }

  /* RIGHT PANEL */
  #right {
    width: 300px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    gap: 1px;
    background: var(--border);
  }
  #right::-webkit-scrollbar { width: 3px; }
  #right::-webkit-scrollbar-thumb { background: var(--border); }

  .card {
    background: var(--bg2);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-title {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim);
    text-transform: uppercase;
  }

  /* Active window card */
  #active-title {
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 11px;
  }
  #active-meta { color: var(--dim); font-size: 10px; }
  #focus-dur { color: var(--accent-yellow); font-size: 11px; }

  /* Resource meters */
  .meter-row { display: flex; flex-direction: column; gap: 3px; }
  .meter-label { display: flex; justify-content: space-between; color: var(--dim); font-size: 10px; }
  .meter-label span:last-child { color: var(--text); }
  .meter-bar {
    height: 3px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .meter-fill.cpu { background: var(--accent-blue); }
  .meter-fill.ram { background: var(--accent-purple); }
  .meter-fill.bat { background: var(--accent-green); }

  /* Battery charging indicator */
  #bat-status { font-size: 9px; color: var(--accent-green); }

  /* Usage bars */
  .usage-row { display: flex; flex-direction: column; gap: 3px; }
  .usage-label { display: flex; justify-content: space-between; }
  .usage-proc { color: var(--text); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .usage-time { color: var(--dim); font-size: 10px; }
  .usage-bar { height: 2px; background: var(--bg3); border-radius: 1px; overflow: hidden; }
  .usage-fill { height: 100%; background: var(--accent-blue); border-radius: 1px; transition: width 0.4s ease; }

  /* Learning progress */
  #learn-bar-wrap { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
  #learn-fill { height: 100%; background: var(--accent-purple); border-radius: 2px; transition: width 0.4s ease; }
  #learn-label { color: var(--dim); font-size: 10px; }
  #learn-reliable { font-size: 9px; color: var(--accent-green); display: none; }

  /* Reminders */
  #reminders-list { display: flex; flex-direction: column; gap: 6px; }
  .reminder-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 8px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .reminder-text { font-size: 11px; line-height: 1.4; flex: 1; }
  .reminder-due { font-size: 9px; color: var(--dim); }
  .dismiss-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: var(--font);
    font-size: 9px;
    padding: 2px 6px;
    cursor: pointer;
    border-radius: 2px;
    flex-shrink: 0;
    transition: border-color 0.2s, color 0.2s;
  }
  .dismiss-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }
  #no-reminders { color: var(--dim); font-size: 10px; }

  /* Mute control */
  #mute-controls { display: flex; gap: 6px; flex-wrap: wrap; }
  .mute-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: var(--font);
    font-size: 10px;
    padding: 3px 8px;
    cursor: pointer;
    border-radius: 2px;
    transition: border-color 0.2s, color 0.2s;
  }
  .mute-btn:hover { border-color: var(--accent-yellow); color: var(--accent-yellow); }
  #mute-status {
    font-size: 9px;
    color: var(--accent-yellow);
    display: none;
    padding: 3px 0;
  }

  /* BOTTOM BAR — last notification */
  #bottombar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    min-height: 32px;
  }
  #notif-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim);
    white-space: nowrap;
  }
  #last-notif {
    font-size: 11px;
    color: var(--accent-yellow);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #notif-time { font-size: 9px; color: var(--dim); white-space: nowrap; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="brand">A.T.L.A.S</div>
  <div class="sys-info">
    <div>CPU <span id="cpu-val">—</span>%</div>
    <div>RAM <span id="ram-val">—</span>%</div>
    <div>BAT <span id="bat-val">—</span>%</div>
  </div>
  <div id="clock">—:——</div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- LEFT: conversation feed -->
  <div id="left">
    <div id="panel-label">CONVERSATION</div>
    <div id="conversation">
      <div id="empty-state">No conversation yet.<br>Say "Hey Jarvis" to begin.</div>
    </div>
  </div>

  <!-- RIGHT: awareness + stats -->
  <div id="right">

    <!-- Active window -->
    <div class="card">
      <div class="card-title">ACTIVE WINDOW</div>
      <div id="active-title">—</div>
      <div id="active-meta">—</div>
      <div id="focus-dur">focused 0.0 min</div>
    </div>

    <!-- System resources -->
    <div class="card">
      <div class="card-title">SYSTEM</div>
      <div class="meter-row">
        <div class="meter-label"><span>CPU</span><span id="cpu-pct">—%</span></div>
        <div class="meter-bar"><div class="meter-fill cpu" id="cpu-bar" style="width:0%"></div></div>
      </div>
      <div class="meter-row">
        <div class="meter-label"><span>RAM</span><span id="ram-pct">—%</span></div>
        <div class="meter-bar"><div class="meter-fill ram" id="ram-bar" style="width:0%"></div></div>
      </div>
      <div class="meter-row">
        <div class="meter-label"><span>BAT</span><span id="bat-pct">—%</span></div>
        <div class="meter-bar"><div class="meter-fill bat" id="bat-bar" style="width:0%"></div></div>
      </div>
      <div id="bat-status"></div>
    </div>

    <!-- Today's usage -->
    <div class="card">
      <div class="card-title">TODAY'S USAGE</div>
      <div id="usage-list"><div style="color:var(--dim);font-size:10px">Loading…</div></div>
    </div>

    <!-- Learning progress -->
    <div class="card">
      <div class="card-title">PATTERN LEARNING</div>
      <div id="learn-bar-wrap"><div id="learn-fill" style="width:0%"></div></div>
      <div id="learn-label">0 / 14 days</div>
      <div id="learn-reliable">✓ Patterns reliable</div>
    </div>

    <!-- Reminders -->
    <div class="card">
      <div class="card-title">REMINDERS</div>
      <div id="reminders-list">
        <div id="no-reminders">No active reminders.</div>
      </div>
    </div>

    <!-- Mute proactive -->
    <div class="card">
      <div class="card-title">MUTE PROACTIVE</div>
      <div id="mute-controls">
        <button class="mute-btn" onclick="mute(30)">30 min</button>
        <button class="mute-btn" onclick="mute(60)">1 hour</button>
        <button class="mute-btn" onclick="mute(480)">Until tomorrow</button>
      </div>
      <div id="mute-status"></div>
    </div>

  </div>
</div>

<!-- BOTTOM BAR -->
<div id="bottombar">
  <div id="notif-label">LAST ALERT</div>
  <div id="last-notif">—</div>
  <div id="notif-time"></div>
</div>

<script>
  let lastLogLength = 0;

  function timeSince(ts) {
    const diff = Math.floor((Date.now() / 1000) - ts);
    if (diff < 60) return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    return `${Math.floor(diff/3600)}h ago`;
  }

  function formatDueTime(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    } catch { return ''; }
  }

  async function refreshState() {
    try {
      const s = await window.pywebview.api.get_live_state();
      document.getElementById('clock').textContent = s.current_time;
      document.getElementById('cpu-val').textContent = Math.round(s.cpu_percent ?? 0);
      document.getElementById('ram-val').textContent = Math.round(s.ram_percent ?? 0);
      document.getElementById('bat-val').textContent = s.battery_percent != null ? Math.round(s.battery_percent) : '—';

      document.getElementById('active-title').textContent = s.active_window_title || '—';
      document.getElementById('active-meta').textContent = s.active_process_name || '—';
      document.getElementById('focus-dur').textContent = `focused ${s.focus_duration_minutes} min`;

      const cpu = Math.round(s.cpu_percent ?? 0);
      const ram = Math.round(s.ram_percent ?? 0);
      const bat = s.battery_percent != null ? Math.round(s.battery_percent) : 0;
      document.getElementById('cpu-pct').textContent = cpu + '%';
      document.getElementById('ram-pct').textContent = ram + '%';
      document.getElementById('bat-pct').textContent = s.battery_percent != null ? bat + '%' : '—';
      document.getElementById('cpu-bar').style.width = cpu + '%';
      document.getElementById('ram-bar').style.width = ram + '%';
      document.getElementById('bat-bar').style.width = bat + '%';

      const batStatus = document.getElementById('bat-status');
      if (s.battery_plugged === true) {
        batStatus.textContent = '⚡ charging';
        batStatus.style.display = 'block';
      } else {
        batStatus.style.display = 'none';
      }
    } catch(e) {}
  }

  async function refreshUsage() {
    try {
      const apps = await window.pywebview.api.get_today_usage();
      const list = document.getElementById('usage-list');
      if (!apps || apps.length === 0) {
        list.innerHTML = '<div style="color:var(--dim);font-size:10px">No usage data yet.</div>';
        return;
      }
      list.innerHTML = apps.map(a => `
        <div class="usage-row">
          <div class="usage-label">
            <span class="usage-proc">${a.process}</span>
            <span class="usage-time">${a.minutes}m</span>
          </div>
          <div class="usage-bar"><div class="usage-fill" style="width:${a.percent_of_max}%"></div></div>
        </div>
      `).join('');
    } catch(e) {}
  }

  async function refreshLearning() {
    try {
      const lp = await window.pywebview.api.get_learning_progress();
      document.getElementById('learn-fill').style.width = lp.percent + '%';
      document.getElementById('learn-label').textContent = `${lp.days_available} / ${lp.days_needed} days`;
      const rel = document.getElementById('learn-reliable');
      rel.style.display = lp.reliable ? 'block' : 'none';
    } catch(e) {}
  }

  async function refreshReminders() {
    try {
      const reminders = await window.pywebview.api.get_reminders();
      const list = document.getElementById('reminders-list');
      const noR = document.getElementById('no-reminders');
      if (!reminders || reminders.length === 0) {
        noR.style.display = 'block';
        list.querySelectorAll('.reminder-item').forEach(el => el.remove());
        return;
      }
      noR.style.display = 'none';
      list.querySelectorAll('.reminder-item').forEach(el => el.remove());
      reminders.forEach(r => {
        const div = document.createElement('div');
        div.className = 'reminder-item';
        const due = r.due_at ? `<div class="reminder-due">due ${formatDueTime(r.due_at)}</div>` : '';
        div.innerHTML = `
          <div>
            <div class="reminder-text">${r.text}</div>
            ${due}
          </div>
          <button class="dismiss-btn" onclick="dismissReminder('${r.text.replace(/'/g,"\\'")}', this.closest('.reminder-item'))">✕</button>
        `;
        list.appendChild(div);
      });
    } catch(e) {}
  }

  async function dismissReminder(text, el) {
    el.style.opacity = '0.4';
    try {
      await window.pywebview.api.dismiss_reminder(text);
      el.remove();
      const list = document.getElementById('reminders-list');
      if (!list.querySelector('.reminder-item')) {
        document.getElementById('no-reminders').style.display = 'block';
      }
    } catch(e) { el.style.opacity = '1'; }
  }

  async function mute(minutes) {
    try {
      await window.pywebview.api.mute_proactive(minutes);
      refreshMuteStatus();
    } catch(e) {}
  }

  async function refreshMuteStatus() {
    try {
      const status = await window.pywebview.api.get_mute_status();
      const el = document.getElementById('mute-status');
      if (status.muted) {
        el.textContent = `⏸ muted — ${status.remaining_minutes}m remaining`;
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    } catch(e) {}
  }

  async function refreshConversation() {
    try {
      const log = await window.pywebview.api.get_conversation_log();
      if (!log || log.length === lastLogLength) return;
      lastLogLength = log.length;
      const feed = document.getElementById('conversation');
      const empty = document.getElementById('empty-state');
      if (log.length > 0 && empty) empty.style.display = 'none';
      feed.querySelectorAll('.msg').forEach(el => el.remove());
      log.forEach(entry => {
        const div = document.createElement('div');
        div.className = `msg ${entry.speaker}`;
        const label = entry.speaker === 'user' ? 'YOU' : 'ATLAS';
        div.innerHTML = `
          <div class="label">${label}</div>
          <div class="bubble">${entry.text}</div>
        `;
        feed.appendChild(div);
      });
      feed.scrollTop = feed.scrollHeight;
    } catch(e) {}
  }

  async function refreshNotification() {
    try {
      const n = await window.pywebview.api.get_last_notification();
      if (!n) return;
      document.getElementById('last-notif').textContent = n.message;
      document.getElementById('notif-time').textContent = timeSince(n.timestamp);
    } catch(e) {}
  }

  window.addEventListener('pywebviewready', function() {
    refreshState();
    refreshUsage();
    refreshLearning();
    refreshReminders();
    refreshMuteStatus();
    refreshConversation();
    refreshNotification();

    setInterval(refreshState,        3000);
    setInterval(refreshConversation, 2000);
    setInterval(refreshUsage,       30000);
    setInterval(refreshLearning,    60000);
    setInterval(refreshReminders,   10000);
    setInterval(refreshMuteStatus,  15000);
    setInterval(refreshNotification,10000);
  });
</script>
</body>
</html>
